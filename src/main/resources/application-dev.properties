server.port=${SERVER_PORT:8081}

spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/after}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.afterApp.after=DEBUG
logging.level.root=INFO
logging.file.name=logs/application.log

management.endpoints.web.exposure.include=health,info,metrics

jwt.secret=${JWT_SECRET}

after.admin.username=${AFTER_ADMIN_USERNAME}
after.admin.password=${AFTER_ADMIN_PASSWORD}
after.admin.name=${AFTER_ADMIN_NAME}
after.admin.lastname=${AFTER_ADMIN_LASTNAME}
after.admin.email=${AFTER_ADMIN_EMAIL}
after.admin.phone-number=${AFTER_ADMIN_PHONE_NUMBER}