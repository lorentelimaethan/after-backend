spring.application.name=after
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/after}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

after.admin.username=${AFTER_ADMIN_USERNAME:adminUs}
after.admin.password=${AFTER_ADMIN_PASSWORD}
after.admin.name=${AFTER_ADMIN_NAME:After}
after.admin.lastname=${AFTER_ADMIN_LASTNAME:Admin}
after.admin.email=${AFTER_ADMIN_EMAIL:admin@example.com}
after.admin.phone-number=${AFTER_ADMIN_PHONE:+34000000000}

logging.level.com.afterApp.after=INFO
logging.level.root=INFO
logging.file.name=logs/application.log
management.endpoints.web.exposure.include=health,info,metrics
